# Alibaba B2B Sourcing stack: PocketBase (auth + metadata) + FastAPI backend.
#
#   cp .env.example .env   # fill in SCRAPINGBEE_API_KEY, PB_ADMIN_*, CORS_ORIGINS, ...
#   docker compose up -d --build
#
# STANDALONE DEV STACK. Production is orchestrated by the valenvalley monorepo
# (docker-compose.yml + Caddy at its root), which builds this repo's Dockerfiles
# (backend/Dockerfile, pocketbase/Dockerfile) with this repo as a submodule.
#
# The SvelteKit frontend lives in a separate repository. The "frontend" profile builds it
# from FRONTEND_CONTEXT (its own Dockerfile) for end-to-end dev testing:
#   FRONTEND_CONTEXT=../front docker compose --profile frontend up -d --build

name: alibaba-sourcing

services:
  pocketbase:
    build:
      context: ./pocketbase
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      PB_APP_NAME: ${PB_APP_NAME:-Alibaba Sourcing}
      PB_APP_URL: ${PB_APP_URL:-http://localhost:5173}
      PB_SMTP_HOST: ${PB_SMTP_HOST:-}
      PB_SMTP_PORT: ${PB_SMTP_PORT:-587}
      PB_SMTP_USERNAME: ${PB_SMTP_USERNAME:-}
      PB_SMTP_PASSWORD: ${PB_SMTP_PASSWORD:-}
      PB_SMTP_TLS: ${PB_SMTP_TLS:-false}
      PB_SMTP_SENDER: ${PB_SMTP_SENDER:-}
    volumes:
      - pb_data:/pb/pb_data
    # Published on localhost only. Put a TLS reverse proxy in front for public access;
    # the browser must reach PocketBase directly for login/signup.
    ports:
      - "${PB_BIND:-127.0.0.1}:${PB_PORT:-8090}:8090"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Container-internal wiring always wins over .env values
      POCKETBASE_URL: http://pocketbase:8090
      OUTPUT_DIR: /app/output
      DEBUG_DIR: /app/debug_raw
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - backend_output:/app/output
      - backend_debug:/app/debug_raw
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Dev-only: the SvelteKit app is built from its own repository (see its Dockerfile).
  # It logs users in against PocketBase on the server side and calls this backend with the
  # user's token, so neither PocketBase nor the backend needs to be reachable from the browser
  # for the app to work.
  frontend:
    profiles: ["frontend"]
    build:
      context: ${FRONTEND_CONTEXT:-./frontend}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
      POCKETBASE_URL: http://pocketbase:8090
      ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "${FRONTEND_PORT:-5173}:3000"

volumes:
  pb_data:
  backend_output:
  backend_debug:
